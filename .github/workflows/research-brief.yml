name: Research Brief

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai (UTC+8).
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Search window in days"
        required: false
        default: "7"
      send_email:
        description: "Send email"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      import_zotero:
        description: "Import selected papers to Zotero"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore previously recommended papers
        uses: actions/cache@v4
        with:
          path: research_briefs/seen_dois.json
          key: research-brief-seen-${{ github.run_id }}
          restore-keys: |
            research-brief-seen-

      - name: Cache local AI model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ollama
          key: ollama-qwen2.5-1.5b-v1

      - name: Start local AI model
        run: |
          mkdir -p "${RUNNER_TEMP}/ollama"
          docker run -d --name research-ollama -p 11434:11434 -v "${RUNNER_TEMP}/ollama:/root/.ollama" ollama/ollama:latest
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec research-ollama ollama pull qwen2.5:1.5b

      - name: Generate research brief
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RESEARCH_BRIEF_FROM_EMAIL: ${{ secrets.RESEARCH_BRIEF_FROM_EMAIL }}
          RESEARCH_BRIEF_TO_EMAIL: ${{ secrets.RESEARCH_BRIEF_TO_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_TO_EMAIL: ${{ secrets.SMTP_TO_EMAIL }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          SMTP_RETRIES: ${{ secrets.SMTP_RETRIES }}
          RESEARCH_BRIEF_CONTACT_EMAIL: ${{ secrets.RESEARCH_BRIEF_CONTACT_EMAIL }}
          AI_MODEL: qwen2.5:1.5b
          OLLAMA_URL: http://127.0.0.1:11434/api/chat
          IEEE_XPLORE_API_KEY: ${{ secrets.IEEE_XPLORE_API_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_GROUP_ID: ${{ secrets.ZOTERO_GROUP_ID }}
          ZOTERO_COLLECTION_KEY: ${{ secrets.ZOTERO_COLLECTION_KEY }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
          IMPORT_ZOTERO: ${{ github.event.inputs.import_zotero || 'false' }}
        run: |
          EMAIL_FLAG=""
          if [ "${SEND_EMAIL}" = "false" ]; then
            EMAIL_FLAG="--no-email"
          fi
          ZOTERO_FLAG=""
          if [ "${IMPORT_ZOTERO}" = "true" ]; then
            ZOTERO_FLAG="--zotero"
          fi
          python scripts/generate_research_brief.py --days-back "${DAYS_BACK}" ${EMAIL_FLAG} ${ZOTERO_FLAG}

